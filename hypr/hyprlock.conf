# hyprlock - Catppuccin Mocha

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    brightness = 0.7
    contrast = 1.0
    saturation = 1.0
    vibrancy = 0.2
    vibrancy_darkness = 0.2
}

input-field {
    monitor =
    size = 260, 50
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.5
    dots_center = true

    outer_color = rgba(181, 190, 254, 0.8)
    inner_color = rgba(49, 50, 68, 0.9)
    font_color = rgb(205, 214, 244)

    fade_on_empty = true
    fade_timeout = 1000
    placeholder_text = <span foreground="##a6adc8">Contraseña...</span>
    hide_input = false
    rounding = 12
    check_color = rgba(166, 227, 161, 0.8)
    fail_color = rgba(243, 139, 168, 0.8)
    fail_text = <b>Incorrecta</b>
    fail_transition = 300
    position = 0, -120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "<span foreground='##cdd6f4'>$(date +"%H:%M")</span>"
    color = rgba(205, 214, 244, 1.0)
    font_size = 80
    font_family = "JetBrainsMono Nerd Font"
    position = 0, -40
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "<span foreground='##a6adc8'>$(date +"%A, %d de %B %Y")</span>"
    color = rgba(166, 173, 200, 1.0)
    font_size = 18
    font_family = "JetBrainsMono Nerd Font"
    position = 0, -90
    halign = center
    valign = center
}
